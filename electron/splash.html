<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResearchSense</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        .splash-card {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 24px;
            padding: 48px 56px;
            text-align: center;
            width: 420px;
            box-shadow:
                0 0 60px rgba(139, 92, 246, 0.15),
                0 32px 64px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1); }
        }

        .brain-icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 8px rgba(139,92,246,0.4)); }
            50%       { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(139,92,246,0.8)); }
        }

        .app-name {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .app-tagline {
            font-size: 13px;
            color: rgba(139, 92, 246, 0.8);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 36px;
        }

        .status-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-top-color: rgba(139, 92, 246, 0.9);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-bar {
            margin-top: 24px;
            height: 3px;
            background: rgba(139, 92, 246, 0.15);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #6366f1);
            border-radius: 2px;
            animation: progress 3s ease-in-out infinite;
        }

        @keyframes progress {
            0%   { width: 5%;  opacity: 0.6; }
            50%  { width: 80%; opacity: 1;   }
            100% { width: 95%; opacity: 0.8; }
        }

        .version {
            margin-top: 24px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <span class="brain-icon">🧠</span>
        <div class="app-name">ResearchSense</div>
        <div class="app-tagline">Academic Review Instrument</div>

        <div class="status-line">
            <div class="spinner"></div>
            <span id="statusText">Starting analysis engine...</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <div class="version">v1.0.0</div>
    </div>

    <script>
        // Cycle through status messages to show progress
        const messages = [
            'Starting analysis engine...',
            'Loading AI models...',
            'Initialising citation checker...',
            'Warming up Gemini API...',
            'Almost ready...',
        ];
        let i = 0;
        const el = document.getElementById('statusText');
        setInterval(() => {
            i = (i + 1) % messages.length;
            el.textContent = messages[i];
        }, 1800);
    </script>
</body>
</html>
