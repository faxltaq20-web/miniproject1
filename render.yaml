# render.yaml — Render.com deployment config
# Deploy at: https://dashboard.render.com → New → Web Service → Connect GitHub
# Docs: https://render.com/docs/render-yaml

services:
  - type: web
    name: researchsense
    runtime: python
    rootDir: MAIN_PROJECT          # build context is the MAIN_PROJECT/ folder
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free                     # change to "starter" ($7/mo) to eliminate cold starts

    envVars:
      # ── Gemini API Keys ─────────────────────────────────────────────
      # Every key is a secret — set actual values in the Render dashboard
      # under Environment. Optional keys (2..5) can be left blank; the
      # analyzer skips slots with no value.
      - key: GEMINI_KEY_1
        sync: false
      - key: GEMINI_KEY_2
        sync: false
      - key: GEMINI_KEY_3
        sync: false
      - key: GEMINI_KEY_4
        sync: false
      - key: GEMINI_KEY_5
        sync: false

      # ── Model ────────────────────────────────────────────────────────
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      # ── Text Compression (Phase 10) ──────────────────────────────────
      - key: COMPRESSION_MODE
        value: light

      # ── Analysis Result Cache ────────────────────────────────────────
      - key: CACHE_ENABLED
        value: "true"

      # ── Upload limit (MB) ────────────────────────────────────────────
      - key: MAX_UPLOAD_MB
        value: "30"

      # ── CORS allowlist (comma-separated origins, or "*" for dev) ─────
      - key: ALLOWED_ORIGINS
        value: "*"

      # ── Contact ──────────────────────────────────────────────────────
      - key: CONTACT_EMAIL
        value: your-email@example.com
